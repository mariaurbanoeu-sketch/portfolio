name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build clean site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude '_pdf' ./ _site/

      - name: Minify CSS and JS (si falla, se publica sin comprimir)
        run: |
          npx --yes terser@5.31.6 js/site.js -c -m -o _site/js/site.js || cp js/site.js _site/js/site.js
          npx --yes csso-cli@4.0.2 css/site.css -o _site/css/site.css || cp css/site.css _site/css/site.css
          npx --yes terser@5.31.6 sw.js -c -m -o _site/sw.js || cp sw.js _site/sw.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

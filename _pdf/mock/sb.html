<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:transparent;width:1300px}
.sc{position:relative;width:1300px;height:900px;overflow:hidden}
.sh{position:absolute;width:420px;aspect-ratio:595/842;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08),0 18px 30px -10px rgba(0,0,0,.28),0 40px 70px -30px rgba(0,0,0,.35)}
.sh img{display:block;width:100%;height:100%}
.sh::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%,rgba(0,0,0,.04))}
.fan .a{left:170px;top:120px;transform:rotate(-7deg)}
.fan .b{left:440px;top:80px;transform:rotate(1.5deg);z-index:2}
.fan .c{left:710px;top:130px;transform:rotate(8deg)}
.two .a{left:180px;top:70px;width:440px;transform:rotate(-2deg)}
.two .b{left:680px;top:90px;width:440px;transform:rotate(2.5deg)}
</style></head><body>
<div class="sc fan" id="marv-fan"><div class="sh a"><img src="../uni/sb/marv-page2.png"></div><div class="sh b"><img src="../uni/sb/marv-page3.png"></div><div class="sh c"><img src="../uni/sb/marv-page4.png"></div></div>
<div class="sc two" id="marv-two"><div class="sh a"><img src="../uni/sb/marv-page4.png"></div><div class="sh b"><img src="../uni/sb/marv-page5.png"></div></div>
<div class="sc fan" id="rata-fan"><div class="sh a"><img src="../uni/sb/rata-page3.png"></div><div class="sh b"><img src="../uni/sb/rata-page2.png"></div><div class="sh c"><img src="../uni/sb/rata-page5.png"></div></div>
<div class="sc two" id="rata-two"><div class="sh a"><img src="../uni/sb/rata-page6.png"></div><div class="sh b"><img src="../uni/sb/rata-page8.png"></div></div>
<div class="sc fan" id="ng-fan"><div class="sh a"><img src="../uni/sb/ng-page2.png"></div><div class="sh b"><img src="../uni/sb/ng-page1.png"></div><div class="sh c"><img src="../uni/sb/ng-page5.png"></div></div>
<div class="sc two" id="ng-two"><div class="sh a"><img src="../uni/sb/ng-page4.png"></div><div class="sh b"><img src="../uni/sb/ng-page8.png"></div></div>
</body></html>

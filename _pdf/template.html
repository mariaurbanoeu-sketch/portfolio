<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Paula Urbano · Portfolio</title>
<style>
@font-face{font-family:'Montserrat';src:url(../fonts/montserrat.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Bodoni Moda';src:url(../fonts/bodoni.woff2) format('woff2')}
@font-face{font-family:'Pinyon Script';src:url(../fonts/pinyon.woff2) format('woff2')}
@font-face{font-family:'NailsD';src:url(../fonts/nails-display.woff2) format('woff2')}
@font-face{font-family:'NailsDI';src:url(../fonts/nails-display-i.woff2) format('woff2')}
@font-face{font-family:'KronoxD';src:url(../fonts/kronox-display.woff2) format('woff2')}
@font-face{font-family:'NacarD';src:url(../fonts/nacar-display.woff2) format('woff2')}
@font-face{font-family:'NacarDI';src:url(../fonts/nacar-display-i.woff2) format('woff2')}
@font-face{font-family:'AmigosD';src:url(../fonts/amigos-display.woff2) format('woff2')}
@page{size:297mm 210mm;margin:0}
:root{--wine:#221616;--plum:#381A17;--olive:#36321F;--milk:#E8D9C9;--ivory:#FAF6F0;--pink:#EBA9BD;--sans:'Montserrat',Arial,sans-serif;--serif:'Bodoni Moda',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#555}
body{font:400 9pt/1.5 var(--sans);color:var(--wine);-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit;text-decoration:none}
.pg{position:relative;width:297mm;height:210mm;overflow:hidden;page-break-after:always;padding:13mm 15mm 13mm;background:var(--ivory);display:flex;flex-direction:column}
.ft{position:absolute;left:15mm;right:15mm;bottom:6.5mm;display:flex;justify-content:space-between;font:600 6pt/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.5}
.k{font:700 6.8pt/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.qr{width:16mm;height:16mm;flex:0 0 auto}
.go{display:flex;align-items:center;gap:3.5mm;margin-top:auto}
.go span{font:600 7.4pt/1.4 var(--sans)}
.go b{display:block;font-weight:700;text-decoration:underline;text-underline-offset:2pt}
/* marcos */
.br{background:#1b1414;border-radius:2mm;overflow:hidden;}
.bar{display:flex;align-items:center;gap:1.2mm;height:5.6mm;padding:0 2.6mm;font:600 5.6pt/1 var(--sans);color:#cdbfb2}
.bar u{width:1.8mm;height:1.8mm;border-radius:50%;background:#4a3a36;text-decoration:none}
.bar s{margin-left:2.4mm;padding:.8mm 2.6mm;background:#0e0909;border-radius:.8mm;text-decoration:none}
.br img{display:block;width:100%}
.ph{border-radius:4.4mm;overflow:hidden;background:#fff;box-shadow:0 0 0 1.4mm #140d0d}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
/* portada */
.cover{background:var(--wine);color:var(--ivory);padding:16mm 18mm}
.cover .k{color:#cdbfb2;opacity:1}
.cv-g{flex:1;display:grid;grid-template-columns:1fr 1.05fr;gap:12mm;align-items:center}
.cover h1{font:800 60pt/.92 var(--sans);text-transform:uppercase;letter-spacing:-.02em}
.cover .sc{font:400 30pt/1.1 'Pinyon Script',cursive;color:var(--pink);margin:3mm 0 0 1mm}
.cv-d{max-width:100mm;margin-top:8mm;font-size:12pt;line-height:1.5;color:#e2d6cb}
.cv-col{position:relative;height:148mm}
.cv-col .br{position:absolute;width:112mm}
.cv-col .b1{right:0;top:4mm;width:112mm}.cv-col .b3{left:0;bottom:10mm;width:128mm}
.cv-col .ph{position:absolute;right:0;bottom:0;width:34mm;height:74mm}
.cv-f{display:flex;gap:9mm;padding-top:5mm;border-top:.5pt solid #4a3a36;font:600 8pt/1 var(--sans);color:#e2d6cb}
.cv-f a{color:var(--pink)}.cv-f span{margin-left:auto}
/* sobre mí + índice */
.ab-g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16mm;align-items:start;padding-top:4mm}
.ab h2{font:800 26pt/1.02 var(--sans);text-transform:uppercase;margin:4mm 0 5mm}
.ab .big{font:400 14pt/1.4 var(--serif);margin-bottom:5mm}
.ab p{font-size:9.6pt;max-width:120mm;margin-bottom:3mm}
.ab dl{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm;margin-top:7mm;padding-top:5mm;border-top:.5pt solid var(--wine)}
.ab dt,.meta dt{font:700 6.2pt/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:1.2mm}
.ab dd,.meta dd{font:600 8.4pt/1.35 var(--sans)}
.ix{list-style:none;border-top:.5pt solid var(--wine);margin-top:4mm}
.ix li a{display:grid;grid-template-columns:10mm 1fr auto;align-items:baseline;gap:3mm;padding:2.7mm 0;border-bottom:.5pt solid #ddd2c8}
.ix em{font:700 7pt/1 var(--sans);font-style:normal;opacity:.5}
.ix b{font:800 10.5pt/1.1 var(--sans);text-transform:uppercase}
.ix small{display:block;margin-top:.8mm;font-size:7.4pt;opacity:.7}
.ix span{font:600 7.2pt/1 var(--sans);opacity:.55}
/* proyecto: la web */
.pa-g{flex:1;display:grid;grid-template-columns:86mm 1fr;gap:12mm;min-height:0}
.pa-l{display:flex;flex-direction:column;min-height:0}
.pa-t{font-size:40pt;line-height:1;margin:4mm 0 3mm}
.pa-w{font:600 8.4pt/1.3 var(--sans);opacity:.75;margin-bottom:5mm}
.pa-i{font-size:9.4pt;line-height:1.55;margin-bottom:5mm}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3.4mm 6mm;padding-top:4mm;border-top:.5pt solid currentColor}
.pa-r{position:relative;align-self:center;margin-right:8mm}
.pa-r .ph{position:absolute;right:-8mm;bottom:-10mm;width:36mm;height:78mm}
.pa-r.duo{display:flex;gap:6mm;justify-content:center;margin:0}
.pa-r.duo .ph{position:static;width:42mm;height:91mm}
/* proyecto: lo especial */
.pb-h{display:flex;align-items:baseline;gap:5mm;padding-bottom:3mm;margin-bottom:6mm;border-bottom:.5pt solid currentColor}
.pb-h b{font:800 15pt/1 var(--sans);text-transform:uppercase}
.pb-h .k{margin-left:auto}
.fx{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:9mm;min-height:0}
.fx figure{display:flex;flex-direction:column;min-height:0}
.fx .shot{height:104mm;display:flex;align-items:center;justify-content:center;margin-bottom:5mm}
.fx .shot .br{width:100%}
.fx .shot .ph{height:100%;aspect-ratio:390/844}
.fx figcaption{display:grid;grid-template-columns:9mm 1fr;gap:1.2mm 2mm}
.fx figcaption em{grid-row:1/3;font:400 19pt/1 var(--serif);font-style:normal;opacity:.4}
.fx figcaption b{font:800 10pt/1.25 var(--sans)}
.fx figcaption span{font-size:8.3pt;line-height:1.5;opacity:.85}
/* colores de cada cliente */
.nails{background:#F3ECE8;color:#4a2230}.nails .pa-t{font-family:'NailsD',serif}.nails .pa-t i{font-family:'NailsDI',serif;font-style:normal}
.kronox{background:#0B0B0A;color:#EDEAE4}.kronox .pa-t{font-family:'KronoxD',sans-serif;text-transform:uppercase;font-size:46pt}
.nacar{background:#EFE7DC;color:#3a3128}.nacar .pa-t{font-family:'NacarD',serif}.nacar .pa-t i{font-family:'NacarDI',serif;font-style:normal}
.amigos{background:#0F1E3D;color:#F2F4F8}.amigos .pa-t{font-family:'AmigosD',var(--sans);text-transform:uppercase;font-size:26pt;line-height:1.05}
.ea{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm;align-self:center;width:100%}
.ea .ph{aspect-ratio:390/844;box-shadow:0 0 0 1.1mm #050b18}
.ea figcaption{margin-top:3mm;font-size:7pt;line-height:1.4;opacity:.92}
.ea figcaption b{display:block;font-size:7.4pt;margin-bottom:.6mm;color:#FFD23F}
/* secciones extra */
.sh{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:10mm;margin-bottom:7mm}
.sh .sc{grid-column:1/3;font:400 24pt/1.1 'Pinyon Script',cursive;color:#b06a82}
.sh h2{font:800 25pt/1 var(--sans);text-transform:uppercase}
.sh p{justify-self:end;text-align:right;max-width:115mm;font-size:9pt;opacity:.8}
.g3{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;min-height:0}
.g3 article{display:flex;flex-direction:column;min-height:0}
.g3 h3{font:800 12.5pt/1.1 var(--sans);text-transform:uppercase;margin:1.6mm 0 1.6mm}
.g3 .k{margin-top:4mm}
.g3 p{font-size:8.3pt;line-height:1.5}
.g3 .go{padding-top:3mm}.g3 .qr{width:13mm;height:13mm}
.v2{position:relative}.v2 .ph{position:absolute;right:3mm;bottom:-6mm;width:20mm;height:43mm}
.dark{background:#141210;color:#EDEAE4}
.cat{aspect-ratio:16/10.6;display:grid;place-items:center;align-content:center;gap:3mm;padding:5mm;background:linear-gradient(#3d3d3d,#262626);color:#cfcfcf;text-align:center;font:600 7.4pt/1.4 var(--sans);border-radius:2mm}
.cat .qr{width:26mm;height:26mm;padding:2mm;background:#EDEAE4}
/* wordpress */
.wp-g{flex:1;display:grid;grid-template-columns:1.15fr 1fr .9fr;gap:8mm;min-height:0}
.wp-g .br .sc{height:118mm;overflow:hidden;background:#fff}.wp-g .br .sc img{height:100%;object-fit:cover;object-position:top}
.wpa{display:grid;grid-template-columns:22mm 1fr;align-self:start;background:#f0f0f1;color:#1d2327;box-shadow:0 0 0 .3mm #c3c4c7}
.wpa nav{background:#1d2327;color:#c3c4c7;padding:2mm 0;font:500 6pt/1 Arial,sans-serif}
.wpa nav span{display:block;padding:1.6mm 2mm}.wpa nav .on{background:#2271b1;color:#fff}.wpa nav .nw{color:#72aee6}
.wpa main{padding:3mm;display:flex;flex-direction:column;gap:2mm}
.wpa h4{font:600 8.4pt/1.2 Arial,sans-serif}
.wpa fieldset{border:.3mm solid #c3c4c7;background:#fff;padding:2mm}
.wpa legend{font:700 5.6pt/1 Arial,sans-serif;padding:0 1mm;color:#50575e}
.wpa .f{display:block;margin-top:1.6mm;font:600 5.8pt/1.2 Arial,sans-serif}
.wpa .f u{display:block;margin-top:.7mm;padding:1mm 1.4mm;border:.3mm solid #8c8f94;font:400 6pt/1.2 Arial,sans-serif;text-decoration:none;color:#3c434a}
.wp-n{display:flex;flex-direction:column;gap:5mm}
.wp-n h3{font:800 12pt/1.1 var(--sans);text-transform:uppercase;margin:2mm 0 1.4mm}
.wp-n p{font-size:8.2pt;line-height:1.5}
.wp-n .br img{height:auto}
/* figma */
.figma{background:#1E1E1E;color:#E6E6E6}
.figma .sh .sc{color:var(--pink)}
.fgi{height:96mm;display:flex;flex-direction:column;gap:2mm;padding:2.4mm;background:#2C2C2C;border-radius:1.5mm;align-items:center;justify-content:center}
.fgi img{max-width:100%;min-height:0;object-fit:contain;background:#fff;outline:.3mm solid #0D99FF}
.fgi.ds img{max-height:32%}
.fgi.pr{flex-direction:row}.fgi.pr img{max-height:100%;max-width:48%;border-radius:2mm}
.fgl{font:600 6pt/1 var(--sans);color:#B3B3B3;margin-bottom:1.6mm}
.lnk{margin-top:auto;padding-top:2.4mm;font:700 7.4pt/1 var(--sans);color:#7cc4ff;text-decoration:underline;text-underline-offset:2pt}
/* marcas */
.marcas{background:var(--plum);color:var(--ivory)}
.marcas .sh .sc{color:var(--pink)}
.bc{height:58mm;display:grid;place-items:center;overflow:hidden}
.bc img{max-width:78%;max-height:72%;object-fit:contain}
.ap{display:grid;grid-template-columns:1fr 1fr;gap:2mm;margin-top:2mm;height:30mm}
.ap img{width:100%;height:100%;object-fit:cover}
.sw{display:flex;gap:1.4mm;margin-top:2.4mm}
.sw i{flex:1;height:5mm;outline:.2mm solid #6b4e48}
.ty{margin-top:2mm;font:600 6.8pt/1 var(--sans)!important;color:var(--pink)}
/* herramientas */
.tools{background:var(--wine);color:var(--ivory)}
.tools .sh .sc{color:var(--pink)}
.tl-g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:9mm}
.tg .k{display:flex;justify-content:space-between;padding-bottom:2mm;border-bottom:.5pt solid #4a3a36;color:var(--pink);opacity:1}
.tg ul{list-style:none;display:grid;gap:2.8mm;margin-top:3.4mm}
.tg li{display:grid;grid-template-columns:9mm 1fr;column-gap:3mm;align-items:center}
.tg canvas{grid-row:1/3;width:9mm;height:9mm;image-rendering:pixelated}
.tg b{font:800 8.6pt/1.1 var(--sans);text-transform:uppercase}
.tg span{font-size:7.2pt;line-height:1.35;color:#cdbfb2}
/* contacto */
.end{background:var(--wine);color:var(--ivory);padding:16mm 18mm}
.end .k{color:#cdbfb2;opacity:1}
.end-g{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:16mm;align-items:center}
.end h2{font:800 46pt/.95 var(--sans);text-transform:uppercase}
.end .sc{font:400 30pt/1.1 'Pinyon Script',cursive;color:var(--pink)}
.end-d{font-size:12pt;line-height:1.5;margin:6mm 0 8mm;color:#e2d6cb;max-width:120mm}
.ct{list-style:none;display:grid;gap:3mm;max-width:140mm}
.ct li{display:grid;grid-template-columns:26mm 1fr;align-items:baseline;padding-bottom:2.6mm;border-bottom:.5pt solid #4a3a36}
.ct span{font:700 6.6pt/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#cdbfb2}
.ct a,.ct b{font:700 11pt/1.2 var(--sans)}
.ct a{text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:2pt}
.end-q{display:grid;justify-items:center;gap:4mm;text-align:center;font:600 8pt/1.5 var(--sans);color:#cdbfb2}
.end-q .qr{width:46mm;height:46mm;padding:3mm;background:var(--ivory)}
.am-h{display:grid;grid-template-columns:auto 1fr 74mm;gap:10mm;align-items:start}
.am-h .pa-t{margin-top:3mm}
.am-m{display:flex;flex-direction:column;gap:4mm}.am-m .go{margin-top:0}
.amigos .ea{flex:1;min-height:0;grid-template-columns:repeat(5,40mm);justify-content:space-between;align-self:stretch}
.amigos .ea .ph{width:40mm;height:auto}
</style></head><body>
<!--PAGES-->
<script>
/*PIX*/
document.querySelectorAll('canvas[data-tool]').forEach(function (cv) {
  var x = cv.getContext('2d'), c = cv.dataset.c, ab = cv.dataset.tool;
  x.fillStyle = shade(c, .28); x.fillRect(2, 1, 12, 14); x.fillRect(1, 2, 14, 12);
  x.fillStyle = c; x.fillRect(2, 1, 12, 1); x.fillRect(1, 2, 1, 12); x.fillRect(2, 14, 12, 1); x.fillRect(14, 2, 1, 12);
  x.fillStyle = shade(c, .55); x.fillRect(3, 13, 11, 1); x.fillRect(13, 3, 1, 10);
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(3, 3, 2, 1); x.fillRect(3, 4, 1, 1);
  x.fillStyle = c;
  for (var k = 0; k < 2; k++) { var gl = GLYPH[ab[k]]; if (!gl) continue; for (var y = 0; y < 5; y++) for (var i = 0; i < 3; i++) if (gl[y][i] === 'X') x.fillRect(4 + k * 5 + i, 6 + y, 1, 1); }
});
</script>
</body></html>

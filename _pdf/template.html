<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Paula Urbano · Portfolio</title>
<style>
@font-face{font-family:'Montserrat';src:url(../fonts/montserrat.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Bodoni Moda';src:url(../fonts/bodoni.woff2) format('woff2')}
@font-face{font-family:'Pinyon Script';src:url(../fonts/pinyon.woff2) format('woff2')}
@font-face{font-family:'NailsD';src:url(../fonts/nails-display.woff2) format('woff2')}
@font-face{font-family:'NailsDI';src:url(../fonts/nails-display-i.woff2) format('woff2')}
@font-face{font-family:'KronoxD';src:url(../fonts/kronox-display.woff2) format('woff2')}
@font-face{font-family:'NacarD';src:url(../fonts/nacar-display.woff2) format('woff2')}
@font-face{font-family:'NacarDI';src:url(../fonts/nacar-display-i.woff2) format('woff2')}
@font-face{font-family:'AmigosD';src:url(../fonts/amigos-display.woff2) format('woff2')}
@page{size:297mm 210mm;margin:0}
:root{--wine:#221616;--plum:#381A17;--olive:#36321F;--milk:#E8D9C9;--ivory:#FAF6F0;--pink:#EBA9BD;--y:#FFD23F;--mono:'Courier New',monospace;--sans:'Montserrat',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#555}
body{font:400 9.5pt/1.5 var(--sans);color:var(--wine);-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit;text-decoration:none}
.pg{position:relative;width:297mm;height:210mm;overflow:hidden;page-break-after:always;padding:12mm 15mm;background:var(--ivory);display:flex;flex-direction:column}
canvas{image-rendering:pixelated}
.ph{display:flex;gap:6mm;align-items:center;padding-bottom:3mm;margin-bottom:7mm;border-bottom:1.2pt solid currentColor;font:700 7pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ph span:nth-child(2){flex:1;text-align:center;opacity:.75}
.lab{font:700 7pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;margin-bottom:2.5mm;opacity:.7}
.script{font:400 26pt/1 'Pinyon Script',cursive;color:var(--pink);margin-bottom:-2mm}
h2{font:800 30pt/1 var(--sans);text-transform:uppercase;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;margin-top:5mm;padding-top:4mm;border-top:.6pt solid currentColor}
.meta dt{font:700 6.5pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:1mm}
.meta dd{font:600 8.5pt/1.3 var(--sans)}
.qr{width:19mm;height:19mm;flex:0 0 auto}
.go{display:flex;align-items:center;gap:4mm;margin-top:auto;padding-top:5mm}
.go span{font:700 8pt/1.3 var(--mono);letter-spacing:.06em;text-decoration:underline;text-underline-offset:2pt}
.go.sm .qr{width:15mm;height:15mm}
.note{font:italic 7.5pt/1.3 var(--sans);opacity:.7;margin-top:2mm}
.lnk{font:700 7.5pt/1 var(--mono);text-decoration:underline;text-underline-offset:2pt;letter-spacing:.04em}
/* pixel border */
.pxb{box-shadow:0 -1.2mm 0 0 currentColor,0 1.2mm 0 0 currentColor,-1.2mm 0 0 0 currentColor,1.2mm 0 0 0 currentColor}

/* portada */
.cover{background:var(--wine);color:var(--ivory);display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto;padding:14mm 18mm}
.cover .k,.end .k{grid-column:1/3;font:700 8pt/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#cdbfb2}
.cover::before,.end::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.cv-l{align-self:center}
.cover h1{font:800 64pt/.92 var(--sans);text-transform:uppercase;letter-spacing:-.02em}
.cover .script{font-size:38pt;margin:2mm 0 0 2mm}
.cv-d{max-width:95mm;margin-top:8mm;font-size:12pt;line-height:1.45;color:#e2d6cb}
.press{display:flex;align-items:center;gap:3mm;margin-top:9mm;font:700 9pt/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
.tri{width:3mm;height:3.6mm;background:var(--y);clip-path:polygon(0 0,0 100%,100% 50%)}
.cv-r{align-self:center;justify-self:center;display:grid;justify-items:center;gap:4mm}
.egg{width:86mm;height:100mm;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;background:radial-gradient(120% 90% at 30% 20%,#f3c9d4,#EBA9BD 55%,#c9849a);display:grid;justify-items:center;align-content:center;gap:6mm;box-shadow:inset -3mm -4mm 0 rgba(0,0,0,.08)}
.lcd-scr{width:52mm;height:46mm;border-radius:5mm;background:#c4c9aa;box-shadow:inset 0 0 0 2.4mm #3a2a2e;display:grid;place-items:center}
.lcd-scr canvas{width:40mm;height:40mm}
.egg-b{display:flex;gap:5mm}.egg-b i{width:6mm;height:6mm;border-radius:50%;background:#3a2a2e}.egg-b i:nth-child(2){transform:translateY(2.5mm)}
.egg-n{font:700 8pt/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#cdbfb2}
.cv-f{grid-column:1/3;display:flex;gap:8mm;align-items:center;padding-top:5mm;border-top:.6pt solid #4a3a36;font:700 8pt/1 var(--mono);letter-spacing:.06em;color:#e2d6cb}
.cv-f a{color:var(--pink)}.cv-f span{margin-left:auto}

/* sobre mí */
.about{background:var(--milk)}
.ab-g{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14mm;align-items:start}
.about h2{font-size:28pt;max-width:120mm}
.about .big{font:400 15pt/1.35 'Bodoni Moda',serif;margin:6mm 0 5mm;max-width:125mm}
.about p{font-size:10pt;max-width:125mm}
.ab-m{margin-top:8mm}
.facts{display:grid;gap:4mm}
.facts figure{display:grid;grid-template-columns:42mm 1fr;gap:5mm;align-items:center}
.lcd-w{padding:2mm;border-radius:4mm;background:radial-gradient(120% 90% at 30% 20%,#f3c9d4,#EBA9BD 55%,#c9849a)}
.lcd-w canvas{display:block;width:38mm;height:22.2mm;background:#c4c9aa;border-radius:2mm;box-shadow:inset 0 0 0 .8mm #3a2a2e}
.facts figcaption{font-size:9pt;line-height:1.4}.facts figcaption b{display:block;font-weight:700}

/* mapa */
.map{background:var(--olive);color:var(--ivory)}
.map-h{display:flex;align-items:end;gap:8mm}
.map-h .script{margin:0}
.map-h p:last-child{margin-left:auto;font:700 8pt/1.3 var(--mono);color:#cdbfb2;max-width:70mm;text-align:right}
.map-w{position:relative;flex:1;margin-top:6mm;background-color:#36321F;background-image:radial-gradient(#4a4429 .5mm,transparent .6mm),radial-gradient(#2c291a .5mm,transparent .6mm);background-size:7mm 7mm;background-position:0 0,3.5mm 3.5mm;box-shadow:0 0 0 1.2mm var(--wine),0 0 0 2.6mm #2e211e}
.map-w svg{position:absolute;inset:0;width:100%;height:100%}
.map-w polyline{fill:none;stroke:var(--y);stroke-width:1.6mm;stroke-dasharray:2mm 2mm;vector-effect:non-scaling-stroke}
.nd{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2mm;text-align:center}
.nd-i{display:grid;place-items:center;width:15mm;height:15mm;background:var(--milk);color:var(--wine);font:800 15pt/1 var(--mono);box-shadow:0 -1mm 0 0 var(--ivory),0 1mm 0 0 var(--ivory),-1mm 0 0 0 var(--ivory),1mm 0 0 0 var(--ivory),0 2mm 0 0 rgba(0,0,0,.35)}
.nd.fin .nd-i{background:var(--y)}
.nd-l{display:block;padding:1.4mm 2mm;background:#140d0d;font:800 8pt/1.15 var(--sans);text-transform:uppercase;white-space:nowrap}
.nd-l small{display:block;margin-bottom:.8mm;font:700 5.6pt/1 var(--mono);letter-spacing:.12em;color:var(--y)}
.nd-l em{display:block;margin-top:.8mm;font:400 6.4pt/1.2 var(--sans);text-transform:none;color:#cdbfb2;font-style:normal}
.map-g{position:absolute;left:6%;top:70%;margin:-25mm 0 0 4mm}.map-g canvas{width:13mm;height:13mm}

/* proyectos */
.pj-g{flex:1;display:grid;grid-template-columns:1fr 1.32fr;gap:10mm;min-height:0}
.pj-l{display:flex;flex-direction:column;min-height:0}
.pj-t{font-size:34pt;line-height:1;margin-bottom:4mm}
.pj-i{font-size:9.6pt;line-height:1.5;margin-bottom:5mm}
.pj-i.sm{font-size:8.6pt;opacity:.8}
.dec{list-style:none;display:grid;gap:2.6mm}
.dec li{display:grid;grid-template-columns:8mm 1fr;gap:2mm;font-size:8.6pt;line-height:1.4}
.dec li b{font:700 8pt/1.4 var(--mono)}
.dec strong{display:block;font-weight:700;font-size:9pt}
.pj-r{position:relative;align-self:center}
.br{background:#1b1414;border-radius:2.4mm;overflow:hidden;box-shadow:0 3mm 8mm rgba(0,0,0,.25)}
.br figcaption{display:flex;align-items:center;gap:1.4mm;height:7mm;padding:0 3mm;font:700 6.5pt/1 var(--mono);color:#cdbfb2}
.br figcaption i{width:2.2mm;height:2.2mm;border-radius:50%;background:#4a3a36}
.br figcaption span{margin-left:3mm;padding:1mm 3mm;background:#0e0909;border-radius:1mm}
.br img{display:block;width:100%}
.ph-m{position:absolute;right:-5mm;bottom:-10mm;width:36mm;aspect-ratio:390/844;border-radius:5mm;overflow:hidden;background:#fff;box-shadow:0 0 0 1.6mm #140d0d,0 4mm 8mm rgba(0,0,0,.3)}
.ph-m img{width:100%;height:100%;object-fit:cover;object-position:top}
.nails{background:#F3ECE8;color:#4a2230}.nails .pj-t{font:400 38pt/1 'NailsD',serif;text-transform:none}.nails .pj-t i{font-family:'NailsDI',serif;font-style:normal}
.kronox{background:#0B0B0A;color:#EDEAE4}.kronox .pj-t{font:400 44pt/1 'KronoxD',sans-serif;text-transform:uppercase;letter-spacing:.02em}.kronox .dec li b{color:#e5322d}
.nacar{background:#EFE7DC;color:#3a3128}.nacar .pj-t{font:400 38pt/1 'NacarD',serif;text-transform:none}.nacar .pj-t i{font-family:'NacarDI',serif;font-style:normal}
.amigos{background:#0F1E3D;color:#F2F4F8}.amigos .pj-t{font:400 26pt/1.05 'AmigosD',var(--sans);text-transform:uppercase}
.ea-g{flex:1;display:grid;grid-template-columns:.78fr 1.5fr;gap:9mm;min-height:0}
.ea-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm}
.ea-ph{aspect-ratio:390/844;border-radius:3.5mm;overflow:hidden;background:#fff;box-shadow:0 0 0 1.2mm #050b18}
.ea-ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ea-steps figcaption{margin-top:3mm;font-size:7pt;line-height:1.35;opacity:.85}
.ea-steps figcaption b{display:block;font:700 7.2pt/1.3 var(--mono);color:var(--y);margin-bottom:1mm;opacity:1}

/* creativos, figma, marcas */
.cr-h{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:8mm;margin-bottom:6mm}
.cr-h .script{grid-column:1/3}
.cr-h p:last-child{font-size:9pt;max-width:110mm;justify-self:end;text-align:right;opacity:.8}
.crea{background:#141210;color:#EDEAE4}
.cr-g,.fg-g,.br-g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;min-height:0}
.cr-g article,.fg-g article,.br-g article{display:flex;flex-direction:column}
.cr-v{height:46mm;overflow:hidden;background:#000;margin-bottom:4mm;border-radius:1.5mm}
.cr-v img{width:100%;height:100%;object-fit:cover;object-position:top}
.cr-g h3,.fg-g h3,.br-g h3{font:800 14pt/1.1 var(--sans);text-transform:uppercase;margin-bottom:2mm}
.cr-g p,.fg-g p,.br-g p{font-size:8.6pt;line-height:1.45}
.b3{height:100%;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:2.5mm;background:linear-gradient(#3d3d3d,#2a2a2a);color:#bdbdbd;font:700 6pt/1 var(--mono)}
.b3 span{justify-self:start}.b3 canvas{width:20mm;height:20mm;align-self:center}.b3 small{font-size:6pt}
.figma{background:#1E1E1E;color:#E6E6E6}
.fg-f{background:#2C2C2C;border-radius:1.5mm;padding:2.5mm;margin-bottom:4mm}
.fg-l{display:block;font:600 6.5pt/1 var(--sans);color:#B3B3B3;margin-bottom:2mm}
.fg-i{display:grid;grid-template-columns:1fr 1fr;gap:2mm;height:62mm}
.fg-i img{width:100%;height:100%;object-fit:cover;object-position:top;background:#fff;outline:.3mm solid #0D99FF}
.fg-g .lnk{margin-top:3mm;color:#7cc4ff}
.marcas{background:var(--plum);color:var(--ivory)}
.bc{position:relative;height:56mm;display:grid;place-items:center;overflow:hidden;margin-bottom:3mm}
.bc .logo{max-width:80%;max-height:70%;object-fit:contain}
.bc .app{position:absolute;right:2mm;bottom:2mm;width:20mm;height:24mm;object-fit:cover;box-shadow:0 0 0 .8mm var(--ivory)}
.sw{display:flex;gap:1.5mm;margin-bottom:2mm}
.sw i{flex:1;height:8mm;position:relative;box-shadow:inset 0 0 0 .2mm rgba(255,255,255,.3)}
.sw small{position:absolute;left:1mm;bottom:-3.6mm;font:700 5.6pt/1 var(--mono);text-transform:uppercase;color:#cdbfb2}
.ty{margin-top:4mm;font:700 7pt/1 var(--mono)!important;letter-spacing:.06em;color:var(--pink);margin-bottom:2mm}
.br-g .lab{margin-top:auto;padding-top:3mm}

/* herramientas */
.tools{background:var(--wine);color:var(--ivory)}
.tl-g{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8mm}
.tg .lab{display:flex;justify-content:space-between;padding-bottom:2mm;border-bottom:.6pt solid #4a3a36;color:var(--pink);opacity:1}
.tg ul{list-style:none;display:grid;gap:2.6mm;margin-top:3mm}
.tg li{display:grid;grid-template-columns:9mm 1fr;column-gap:3mm;align-items:center}
.tg canvas{grid-row:1/3;width:9mm;height:9mm}
.tg b{font:800 9pt/1.1 var(--sans);text-transform:uppercase}
.tg span{font-size:7.4pt;line-height:1.35;color:#cdbfb2}

/* final */
.end{background:#140d0d;color:var(--ivory);padding:14mm 18mm}
.end-g{flex:1;display:grid;grid-template-columns:.8fr 1.2fr;gap:14mm;align-items:center}
.end-l{display:grid;justify-items:center;gap:5mm}
.end-l canvas{width:62mm;height:62mm;background:#c4c9aa;border-radius:6mm;box-shadow:0 0 0 2mm #3a2a2e}
.end-st{font:800 14pt/1 var(--sans);text-transform:uppercase;color:var(--y)}
.cont{font:800 50pt/1 var(--sans);text-transform:uppercase;color:var(--pink)}
.end-d{font-size:12pt;margin:4mm 0 7mm;color:#e2d6cb}
.ct{list-style:none;display:grid;gap:3mm}
.ct li{display:grid;grid-template-columns:24mm 1fr;align-items:baseline;padding-bottom:2.5mm;border-bottom:.6pt solid #3a2a2a}
.ct span{font:700 7pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#cdbfb2}
.ct a,.ct b{font:700 11pt/1.2 var(--sans)}
.ct a{color:var(--ivory);text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:2pt}
.end-q{display:flex;gap:5mm;align-items:center;margin-top:7mm;font:700 7.5pt/1.5 var(--mono);color:#cdbfb2;text-transform:uppercase;letter-spacing:.08em}
.end-q .qr{width:24mm;height:24mm}
.credits{font:700 6.5pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#7a6a66;text-align:center}
.about .script{margin-bottom:1mm}
.ab-g{align-items:center}
.facts{gap:6mm}.facts figure{grid-template-columns:52mm 1fr}.lcd-w canvas{width:48mm;height:28mm}.facts figcaption{font-size:10pt}
.fg-i{grid-template-rows:100%;overflow:hidden;height:78mm}
.ea-g{grid-template-columns:.62fr 1.7fr;align-items:center}
.ea-steps figcaption{font-size:7.6pt}
.cr-v{height:auto;aspect-ratio:16/10}.cr-v img{object-position:left top}
.about .script{font-size:28pt}
.bc .app{display:none}
.bc{height:76mm}
.bc .app{width:26mm;height:32mm}
</style></head><body>
<!--PAGES-->
<script>
/*PIX*/
var COF = function (cv, c) { var x = cv.getContext('2d'); x.fillStyle = '#FAF6F0'; x.fillRect(26, 21, 5, 6); x.fillRect(31, 22, 1, 3); x.fillStyle = '#eba9bd'; x.fillRect(27, 23, 3, 2); x.fillStyle = '#b9b0a8'; x.fillRect(27, 18, 1, 2); x.fillRect(29, 17, 1, 3); };
document.querySelectorAll('canvas[data-g]').forEach(function (cv) { drawSprite(cv.getContext('2d'), 0, 0, 1, 'happy'); if (cv.dataset.g === 'hired') COF(cv); });
document.querySelectorAll('canvas[data-scene]').forEach(function (cv) { SCN[cv.dataset.scene](cv.getContext('2d'), +cv.dataset.t); });
document.querySelectorAll('canvas[data-tool]').forEach(function (cv) {
  var x = cv.getContext('2d'), c = cv.dataset.c, ab = cv.dataset.tool;
  x.fillStyle = shade(c, .28); x.fillRect(2, 1, 12, 14); x.fillRect(1, 2, 14, 12);
  x.fillStyle = c; x.fillRect(2, 1, 12, 1); x.fillRect(1, 2, 1, 12); x.fillRect(2, 14, 12, 1); x.fillRect(14, 2, 1, 12);
  x.fillStyle = shade(c, .55); x.fillRect(3, 13, 11, 1); x.fillRect(13, 3, 1, 10);
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(3, 3, 2, 1); x.fillRect(3, 4, 1, 1);
  x.fillStyle = c;
  for (var k = 0; k < 2; k++) { var gl = GLYPH[ab[k]]; if (!gl) continue; for (var y = 0; y < 5; y++) for (var i = 0; i < 3; i++) if (gl[y][i] === 'X') x.fillRect(4 + k * 5 + i, 6 + y, 1, 1); }
});
document.querySelectorAll('canvas[data-cube]').forEach(function (cv) { var x = cv.getContext('2d'); var m = ["..........XX..........","........XXooXX........","......XXooooooXX......","....XXooooooooooXX....","..XXooooooooooooooXX..","XXooooooooooooooooooXX","XlXXooooooooooooooXXdX","XlllXXooooooooooXXdddX","XlllllXXooooooXXdddddX","XlllllllXXooXXdddddddX","XlllllllllXXdddddddddX","XlllllllllXdddddddddX.","XlllllllllXddddddddX..",".XXllllllllXdddddXX...","...XXllllllXdddXX.....",".....XXllllXdXX.......",".......XXllXX.........",".........XX..........."]; var C = { X: '#111', o: '#f39a3a', l: '#cf7a25', d: '#8f4f12' }; m.forEach(function (r, y) { for (var i = 0; i < r.length; i++) if (C[r[i]]) { x.fillStyle = C[r[i]]; x.fillRect(1 + i, 3 + y, 1, 1); } }); });
</script>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Prueba · logos animados</title>
<link rel="preload" href="../fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:M;src:url(../fonts/montserrat.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--wine:#221616;--ivory:#FAF6F0}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.5 M,system-ui,sans-serif;background:var(--ivory);color:var(--wine)}
header{max-width:1100px;margin:0 auto;padding:56px 20px 28px}
header p{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
header h1{font-weight:500;font-size:clamp(26px,4vw,40px);margin:8px 0}
header small{opacity:.7}
.g{max-width:1100px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.c{position:relative;aspect-ratio:4/5;display:grid;place-items:center;border-radius:4px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.c figcaption{position:absolute;left:18px;bottom:16px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.lg{position:relative;width:74%;display:grid}
.lg>*{grid-area:1/1}
.lg svg{width:100%;height:auto;display:block;overflow:visible}
.lg canvas{width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.lg .v{opacity:0}
.c.in .lg .v{opacity:1;transition:opacity .25s}
.c.in .lg canvas{opacity:0;transition:opacity .25s}
/* Vora: el sol */
#v-sol{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,1.4,.4,1)}
.vora.on #v-sol{transform:rotate(var(--r,0deg)) scale(1.12)}
/* Café del Sur: la hoja y el vapor */
.cafe .v{display:grid}.cafe .v>div{grid-area:1/1}.cafe .hoja{clip-path:inset(0 0 74% 0);transform-origin:50% 22%;transition:transform .8s cubic-bezier(.2,1.5,.4,1)}
.cafe .resto{clip-path:inset(26% 0 0 0)}
.cafe.on .hoja{transform:rotate(var(--r,-8deg)) translateY(-3%)}
.vapor{position:absolute;left:50%;top:-30%;width:22%;transform:translateX(-50%);pointer-events:none}
.vapor path{fill:none;stroke:#E63837;stroke-width:3;stroke-linecap:round;opacity:0}
.cafe.puff .vapor path{animation:sube 1.4s ease-out forwards}
.cafe.puff .vapor path:nth-child(2){animation-delay:.15s}.cafe.puff .vapor path:nth-child(3){animation-delay:.3s}
@keyframes sube{0%{opacity:0;transform:translateY(20px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-30px)}}
/* Nidoo: el símbolo gira y las formas se cambian de sitio */
#n-simbolo{transform-box:fill-box;transform-origin:50% 50%;transition:transform 1s cubic-bezier(.3,1.6,.4,1)}
.nidoo.on #n-simbolo{transform:rotate(calc(180deg + var(--r,0deg)))}
@media (prefers-reduced-motion:reduce){.lg canvas{display:none}.lg .v{opacity:1}#v-sol,#n-simbolo,.cafe .v{display:grid}.cafe .v>div{grid-area:1/1}.cafe .hoja{transition:none}.vapor{display:none}}
.hint{max-width:1100px;margin:-56px auto 60px;padding:0 20px;font-size:13px;opacity:.65}
</style></head><body>
